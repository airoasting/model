<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모델의 자기소개</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500;700;900&display=swap">
<style>
:root {
  color-scheme: dark;
  /* 허브는 어느 모델의 색도 아닌 중성 먹색. 모델 색은 각 카드 안에서만 쓴다 */
  --bg: #111113;
  --card: #18181b;
  --paper: #ece6da;
  --paper-2: #b0aba2;
  --paper-3: #7c786f;
  --line: #34343a;
  --opus: #e2552b;       /* Opus 사이트의 주홍 */
  --opus-ink: #12110f;
  --sol: #ffad65;        /* Sol 사이트의 해 */
  --sol-2: #ff683b;
  --sol-sky: #0e1726;
  --sol-cyan: #82d9dc;
  --s1: 8px; --s2: 16px; --s3: 24px; --s4: 32px; --s5: 48px; --s6: 64px;
  --serif: 'Noto Serif KR', 'AppleMyungjo', serif;
  --sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: center;
  background: radial-gradient(80% 60% at 50% -10%, #1f1f23, transparent 70%), var(--bg);
  color: var(--paper); font-family: var(--sans); word-break: keep-all;
  padding: calc(env(safe-area-inset-top, 0px) + var(--s4)) max(20px, 5vw) calc(env(safe-area-inset-bottom, 0px) + var(--s3));
}
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; }

/* 머리: 질문과 안내를 한 줄 기준선 위에 */
header { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--s4); row-gap: var(--s2); align-items: end; padding-bottom: var(--s4); border-bottom: 1px solid var(--line); }
.head-l { grid-column: 1 / -1; }
.eyebrow { display: flex; align-items: center; gap: 10px; margin: 0 0 var(--s2); font-size: .82rem; letter-spacing: .2em; color: var(--paper-2); }
.eyebrow::before { content: ''; width: 14px; height: 1px; background: var(--paper-2); }
.eyebrow::before { flex: none; }
.eyebrow q { letter-spacing: .02em; quotes: '“' '”'; color: var(--paper); }
h1 { margin: 0; font-family: var(--serif); font-weight: 700; font-size: min(4.9vw, 3.2rem); line-height: 1.22; letter-spacing: -.02em; white-space: nowrap; }
@media (max-width: 760px) { header { grid-template-columns: minmax(0, 1fr); column-gap: 0; } .head-l { grid-column: 1 / -1; } }

/* 카드 두 장: 같은 틀, 다른 재료 */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); margin-top: var(--s4); }
@media (max-width: 760px) { .cards { grid-template-columns: minmax(0, 1fr); gap: var(--s3); margin-top: var(--s4); } }
.card {
  --mx: 50%; --my: 50%; --rx: 0; --ry: 0;
  position: relative; min-width: 0; display: flex; flex-direction: column; padding: var(--s4);
  background: var(--card); border: 1px solid var(--line); border-radius: 0;
  color: inherit; text-decoration: none; overflow: hidden;
  transform: perspective(1400px) rotateX(calc(var(--rx) * 1deg)) rotateY(calc(var(--ry) * 1deg));
  transition: transform .6s var(--ease), border-color .35s, scale .08s;
  opacity: 0; translate: 0 12px; animation: rise .6s var(--ease) forwards;
}
.card:nth-child(1) { animation-delay: .36s; }
.card:nth-child(2) { animation-delay: .48s; }
.head-l { opacity: 0; translate: 0 12px; animation: rise .6s var(--ease) forwards; }
.head-l { animation-delay: .12s; }
@keyframes rise { to { opacity: 1; translate: 0 0; } }
.card::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s; background: radial-gradient(460px circle at var(--mx) var(--my), var(--glow), transparent 62%); }
.card.opus { --accent: var(--opus); --glow: rgba(226, 85, 43, .13); }
.card.sol { --accent: var(--sol); --glow: rgba(255, 173, 101, .13); }
.card:active { scale: .985; }
.card:focus-visible { outline: 1px solid var(--paper-2); outline-offset: 6px; }

.meta { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); font-size: .8rem; letter-spacing: .12em; color: var(--paper-3); }
.meta b { font-weight: 500; color: var(--paper-2); letter-spacing: .08em; font-variant-numeric: tabular-nums; }

.art { display: grid; place-items: center; padding: var(--s3) 0; }
.plate {
  position: relative; width: min(66%, 300px); aspect-ratio: 5 / 4; overflow: hidden;
  box-shadow: 0 24px 48px -12px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .04);
  translate: calc(var(--ry) * -1.2px) calc(var(--rx) * 1.2px); transition: translate .6s var(--ease);
}
.seal { position: absolute; right: 6%; bottom: 8%; width: 16%; aspect-ratio: 1; display: grid; place-items: center; text-align: center; font-family: var(--serif); font-weight: 900; line-height: 1.02; transform: rotate(-3deg); }
.seal.off { opacity: 0; }
.seal.on { animation: stamp .22s cubic-bezier(.3, 1.4, .5, 1) forwards; }
@keyframes stamp { from { transform: rotate(-3deg) scale(1.15); opacity: 0; } to { transform: rotate(-3deg) scale(1); opacity: 1; } }

/* Opus: 한지 위에 먹으로 쓰는 劃 */
.plate.hanji { background: #ece3cf; }
.plate.hanji svg { position: absolute; left: 50%; top: 50%; height: 84%; width: auto; translate: -50% -50%; }
.plate.hanji .ink { fill: #16130f; }
.plate.hanji .ghost { fill: #16130f; opacity: 0; transition: opacity .2s; }
.plate.hanji.retrace .ghost { opacity: .12; }
.plate.hanji .note { position: absolute; left: 7%; bottom: 7%; writing-mode: vertical-rl; font-family: var(--serif); font-weight: 600; font-size: clamp(11px, 1.1vw, 13px); letter-spacing: .28em; color: rgba(22, 19, 15, .82); }
.card.opus .seal { background: var(--opus); color: #ece3cf; font-size: clamp(8px, .95vw, 11px); }

/* Sol: 남색 하늘 아래에서 떠오르는 해 (Sol 사이트의 색) */
.plate.sky { background: linear-gradient(#090f1c 0%, #0e1726 55%, #1b2436 100%); }
.plate.sky .warm { position: absolute; inset: 0; background: radial-gradient(90% 55% at 50% 78%, rgba(255, 104, 59, .38), transparent 70%); opacity: .35; transition: opacity .9s var(--ease); }
.plate.sky .sun { position: absolute; left: 50%; top: 50%; width: 38%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 42%, #ffe2bd, var(--sol) 52%, var(--sol-2)); box-shadow: 0 0 70px rgba(255, 173, 101, .35); transform: translate(-50%, 60%); transition: transform 1.2s var(--ease), box-shadow .9s; }
.plate.sky.up .sun { transform: translate(-50%, 0); }
.plate.sky .horizon { position: absolute; left: 0; right: 0; top: 70%; bottom: 0; background: linear-gradient(#0c1422, #070b14); border-top: 1px solid rgba(130, 217, 220, .3); transition: border-color .9s; }
.card.sol .seal { background: var(--sol); color: var(--sol-sky); font-size: clamp(9px, 1.05vw, 12px); }

.name { margin: 0; font-family: var(--serif); font-weight: 700; font-size: clamp(1.5rem, 2.4vw, 2rem); line-height: 1.2; letter-spacing: -.01em; }
.tag { margin: var(--s1) 0 0; font-family: var(--serif); font-weight: 500; font-size: 1rem; color: var(--paper); }
.desc { margin: 4px 0 0; font-size: .88rem; line-height: 1.7; color: var(--paper-2); }
.go { display: flex; justify-content: space-between; align-items: center; margin-top: var(--s3); padding-top: var(--s2); border-top: 1px solid var(--line); font-size: .9rem; font-weight: 500; color: var(--accent); }
.go svg { width: 14px; height: 14px; transition: transform .3s var(--ease); }

/* 마우스가 있는 기기에서만 호버 */
@media (hover: hover) and (pointer: fine) {
  .card:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .card:hover::before { opacity: 1; }
  .card:hover .go svg { transform: translateX(6px); }
  .card.sol:hover .sun { transform: translate(-50%, -22%); box-shadow: 0 0 120px rgba(255, 173, 101, .55); }
  .card.sol:hover .warm { opacity: 1; }
  .card.sol:hover .horizon { border-color: rgba(130, 217, 220, .7); }
}
.card:focus-visible .go svg { transform: translateX(6px); }

footer { display: flex; justify-content: space-between; gap: var(--s2); flex-wrap: wrap; margin-top: var(--s4); padding-top: var(--s2); border-top: 1px solid var(--line); font-size: .78rem; color: var(--paper-3); opacity: 0; animation: rise .6s var(--ease) .6s forwards; }

/* 먹색으로 번지며 넘어가기 */
.veil { position: fixed; inset: 0; z-index: 9; pointer-events: none; opacity: 0; transition: opacity .28s ease; }
.veil.on { opacity: 1; }

@media (max-width: 760px) {
  .card { padding: var(--s3); }
  .plate { width: 56%; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .head-l, footer { animation: none; opacity: 1; translate: none; }
  .card, .plate, .sun, .warm, .horizon, .go svg { transition: none !important; }
  .plate.sky .sun { transform: translate(-50%, 0); }
  .seal.on { animation: none; }
}
</style>

  <footer><span>각 페이지의 모델 정보는 모델을 만든 회사의 공식 발표를 따릅니다.</span></footer>
</div>
<div class="veil" aria-hidden="true"></div>

<script>
(() => {
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FINE = matchMedia('(hover: hover) and (pointer: fine)').matches;
  const MEDIANS = [[[259,713],[301,711],[366,722],[490,753],[518,746],[541,726],[507,611],[486,595]],[[126,603],[174,593],[554,663],[604,667],[628,662]],[[263,532],[302,532],[502,571],[543,564]],[[263,447],[297,442],[455,475],[505,472]],[[345,829],[389,790],[382,413],[367,392]],[[159,350],[195,341],[527,396],[579,389]],[[212,280],[237,259],[245,244],[280,106]],[[268,280],[284,273],[450,312],[509,308],[525,293],[528,275],[491,148],[494,134]],[[317,208],[422,233],[449,229]],[[394,279],[379,255],[380,179],[365,160]],[[298,120],[314,131],[441,155],[466,165]],[[148,39],[213,27],[519,80],[544,82],[585,74]],[[667,624],[692,597],[696,584],[698,414],[692,327],[697,291]],[[797,812],[846,772],[845,451],[855,78],[835,33],[714,90]]];

  /* 劃 붓쓰기: 획마다 중심선 마스크를 획순대로 연다 */
  const opus = document.getElementById('card-opus');
  const hanji = opus.querySelector('.hanji'), ops = opus.querySelector('.seal');
  const inks = [...opus.querySelectorAll('.ink path')];
  const masks = [...opus.querySelectorAll('mask path')];
  const lens = MEDIANS.map(m => m.reduce((a, p, i) => i ? a + Math.hypot(p[0] - m[i - 1][0], p[1] - m[i - 1][1]) : 0, 0));
  let writing = false, lastDone = -Infinity;
  if (!RM) { masks.forEach(m => m.style.strokeDashoffset = 1); ops.classList.add('off'); }
  function write() {
    if (writing || performance.now() - lastDone < 3000) return;
    writing = true;
    if (RM) { masks.forEach(m => m.style.strokeDashoffset = 0); ops.classList.add('on'); writing = false; return; }
    const redo = lastDone > -Infinity;
    if (redo) hanji.classList.add('retrace');
    ops.classList.remove('on'); ops.classList.add('off');
    masks.forEach(m => m.style.strokeDashoffset = 1);
    let t = redo ? 220 : 0;
    const anims = masks.map((m, i) => {
      const dur = Math.max(110, Math.min(240, 60 + lens[i] * .32));
      const a = m.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: dur, delay: t, easing: 'cubic-bezier(.45, 0, .15, 1)', fill: 'forwards' });
      t += dur + 45;
      return a;
    });
    anims[anims.length - 1].onfinish = () => {
      masks.forEach(m => m.style.strokeDashoffset = 0);
      anims.forEach(a => a.cancel());
      hanji.classList.remove('retrace');
      ops.classList.remove('off'); ops.classList.add('on');
      writing = false; lastDone = performance.now();
    };
  }

  /* Sol: 해가 수평선 위로 올라온다 */
  const sky = document.querySelector('.plate.sky'), sseal = sky.querySelector('.seal');
  if (!RM) sseal.classList.add('off');
  function sunrise() { sky.classList.add('up'); setTimeout(() => { sseal.classList.remove('off'); sseal.classList.add('on'); }, RM ? 0 : 1100); }

  /* 처음 한 번은 카드가 화면에 들어올 때 저절로 (휴대폰에서도 보이게) */
  const once = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    once.unobserve(e.target);
    setTimeout(() => e.target === opus ? write() : sunrise(), RM ? 0 : 700);
  }), { threshold: .5 });
  once.observe(opus); once.observe(document.getElementById('card-sol'));

  document.querySelectorAll('.card').forEach(card => {
    if (FINE && !RM) {
      card.addEventListener('pointermove', e => {
        const r = card.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
        card.style.setProperty('--mx', x * 100 + '%'); card.style.setProperty('--my', y * 100 + '%');
        card.style.setProperty('--ry', ((x - .5) * 5).toFixed(2)); card.style.setProperty('--rx', ((.5 - y) * 5).toFixed(2));
      });
      card.addEventListener('pointerleave', () => { card.style.setProperty('--rx', 0); card.style.setProperty('--ry', 0); });
    }
    // 새 탭으로 열 때는 막지 않는다. 그 밖에는 그 모델의 바탕색으로 번진 뒤 넘어간다
    card.addEventListener('click', e => {
      if (RM || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
      e.preventDefault();
      const veil = document.querySelector('.veil');
      veil.style.background = card.dataset.world; veil.classList.add('on');
      setTimeout(() => { location.href = card.getAttribute('href'); }, 280);
    });
  });
  if (FINE) opus.addEventListener('pointerenter', write);
  opus.addEventListener('focus', () => { if (opus.matches(':focus-visible')) write(); });
  // 뒤로 가기로 돌아오면 번짐을 걷는다
  addEventListener('pageshow', () => document.querySelector('.veil').classList.remove('on'));
})();
</script>
</body>
</html>
